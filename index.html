<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyber Awareness Club | Cyber Security</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        :root {
            --cyan: #00eaff;
            --blue: #3478ff;
            --purple: #8b5cf6;
            --pink: #ff3cac;
            --green: #32f5a9;
            --dark: #050510;
            --dark2: #080b18;
            --card: #0d1020;
            --text: #f4f7ff;
            --muted: #9da7bd;
            --border: rgba(255,255,255,0.1);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--dark);
            color: var(--text);
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           BACKGROUND
        ========================= */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.08;
            background-image:
                linear-gradient(rgba(0,234,255,.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,234,255,.4) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            top: 10%;
            left: 30%;
            background: radial-gradient(circle, rgba(0,234,255,.08), transparent 65%);
            filter: blur(30px);
            pointer-events: none;
            z-index: -1;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 18px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(5,5,16,.75);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid transparent;
            transition: .3s;
        }

        .navbar.scrolled {
            background: rgba(5,5,16,.95);
            border-bottom: 1px solid rgba(0,234,255,.2);
            box-shadow: 0 10px 40px rgba(0,0,0,.4);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,234,255,.25);
        }

        .nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
            transition: .3s;
            position: relative;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--cyan);
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -8px;
            width: 0;
            height: 2px;
            background: var(--cyan);
            transition: .3s;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .menu-btn {
            display: none;
            background: none;
            border: 1px solid var(--border);
            color: white;
            font-size: 22px;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* =========================
           GENERAL
        ========================= */

        section {
            padding: 100px 8%;
            scroll-margin-top: 80px;
        }

        .section-tag {
            color: var(--cyan);
            font-size: 12px;
            letter-spacing: 3px;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .section-title {
            font-size: clamp(30px, 4vw, 52px);
            margin-bottom: 18px;
            line-height: 1.1;
        }

        .section-text {
            color: var(--muted);
            line-height: 1.8;
            max-width: 750px;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 100vh;
            padding-top: 130px;
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            align-items: center;
            gap: 50px;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-label {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            border: 1px solid rgba(0,234,255,.25);
            border-radius: 30px;
            color: var(--cyan);
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-bottom: 25px;
            background: rgba(0,234,255,.04);
        }

        .hero-label span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 12px var(--green);
        }

        .hero h1 {
            font-size: clamp(45px, 6vw, 78px);
            line-height: .98;
            margin-bottom: 25px;
            letter-spacing: -3px;
        }

        .hero h1 span {
            background: linear-gradient(
                90deg,
                var(--cyan),
                var(--purple),
                var(--pink)
            );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .hero p {
            color: var(--muted);
            max-width: 650px;
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 13px 22px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 14px;
            transition: .3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--cyan);
            color: #001014;
            box-shadow: 0 0 25px rgba(0,234,255,.2);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(0,234,255,.4);
        }

        .btn-outline {
            border: 1px solid var(--border);
            color: white;
            background: rgba(255,255,255,.03);
        }

        .btn-outline:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            transform: translateY(-3px);
        }

        /* =========================
           HERO VISUAL
        ========================= */

        .hero-visual {
            min-height: 500px;
            position: relative;
            display: grid;
            place-items: center;
        }

        .shield {
            width: 310px;
            height: 360px;
            position: relative;
            display: grid;
            place-items: center;
            filter: drop-shadow(0 0 40px rgba(0,234,255,.15));
        }

        .shield svg {
            width: 100%;
            height: 100%;
        }

        .orbit {
            position: absolute;
            width: 430px;
            height: 430px;
            border: 1px solid rgba(0,234,255,.12);
            border-radius: 50%;
            animation: spin 15s linear infinite;
        }

        .orbit::before {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--cyan);
            box-shadow: 0 0 20px var(--cyan);
            top: 20px;
            left: 50%;
        }

        .orbit.two {
            width: 350px;
            height: 350px;
            animation-direction: reverse;
            animation-duration: 10s;
            border-color: rgba(139,92,246,.12);
        }

        .orbit.two::before {
            background: var(--purple);
            box-shadow: 0 0 20px var(--purple);
            top: auto;
            bottom: 20px;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
            margin-top: 40px;
        }

        .stat-card {
            padding: 25px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,.025);
            border-radius: 16px;
            transition: .3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(0,234,255,.25);
            background: rgba(0,234,255,.03);
        }

        .stat-number {
            font-size: 35px;
            font-weight: 800;
            color: var(--cyan);
            margin-bottom: 5px;
        }

        .stat-label {
            color: var(--muted);
            font-size: 13px;
             }

<script>

/* =========================
   NAVBAR SCROLL
========================= */

const navbar = document.getElementById("navbar");

window.addEventListener("scroll", () => {

    if (window.scrollY > 30) {
        navbar.classList.add("scrolled");
    } else {
        navbar.classList.remove("scrolled");
    }

});


/* =========================
   MOBILE MENU
========================= */

const menuBtn = document.getElementById("menuBtn");
const navLinks = document.getElementById("navLinks");

menuBtn.addEventListener("click", () => {

    navLinks.classList.toggle("show");

});


/* =========================
   CLOSE MOBILE MENU
========================= */

document.querySelectorAll(".nav-links a").forEach(link => {

    link.addEventListener("click", () => {

        navLinks.classList.remove("show");

    });

});


/* =========================
   MODAL
========================= */

const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const modalText = document.getElementById("modalText");


function openModal(title, text) {

    modalTitle.textContent = title;
    modalText.textContent = text;

    modal.classList.add("active");

    document.body.style.overflow = "hidden";

}


function closeModal() {

    modal.classList.remove("active");

    document.body.style.overflow = "";

}


modal.addEventListener("click", (event) => {

    if (event.target === modal) {
        closeModal();
    }

});


/* =========================
   ACTIVE NAVIGATION
========================= */

const sections = document.querySelectorAll("section[id]");
const links = document.querySelectorAll(".nav-links a");

window.addEventListener("scroll", () => {

    let current = "";

    sections.forEach(section => {

        const sectionTop = section.offsetTop - 150;

        if (window.scrollY >= sectionTop) {
            current = section.getAttribute("id");
        }

    });


    links.forEach(link => {

        link.classList.remove("active");

        if (link.getAttribute("href") === "#" + current) {
            link.classList.add("active");
        }

    });

});


/* =========================
   ESCAPE MODAL
========================= */

document.addEventListener("keydown", (event) => {

    if (event.key === "Escape") {
        closeModal();
    }

});

</script>

</body>
