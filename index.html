<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cyber Awareness Club | Cyber Security</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        :root {
            --cyan: #00eaff;
            --blue: #3478ff;
            --purple: #8b5cf6;
            --pink: #ff3cac;
            --green: #32f5a9;
            --dark: #050510;
            --dark2: #080b18;
            --card: #0d1020;
            --text: #f4f7ff;
            --muted: #9da7bd;
            --border: rgba(255,255,255,0.1);
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: var(--dark);
            color: var(--text);
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           BACKGROUND
        ========================= */

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.08;
            background-image:
                linear-gradient(rgba(0,234,255,.4) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,234,255,.4) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            top: 10%;
            left: 30%;
            background: radial-gradient(circle, rgba(0,234,255,.08), transparent 65%);
            filter: blur(30px);
            pointer-events: none;
            z-index: -1;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            padding: 18px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(5,5,16,.75);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid transparent;
            transition: .3s;
        }

        .navbar.scrolled {
            background: rgba(5,5,16,.95);
            border-bottom: 1px solid rgba(0,234,255,.2);
            box-shadow: 0 10px 40px rgba(0,0,0,.4);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border: 1px solid var(--cyan);
            color: var(--cyan);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,234,255,.25);
        }

        .nav-links {
            display: flex;
            gap: 28px;
            list-style: none;
        }

        .nav-links a {
            color: var(--muted);
            font-size: 14px;
            font-weight: 600;
            transition: .3s;
            position: relative;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--cyan);
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -8px;
            width: 0;
            height: 2px;
            background: var(--cyan);
            transition: .3s;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .menu-btn {
            display: none;
            background: none;
            border: 1px solid var(--border);
            color: white;
            font-size: 22px;
            padding: 6px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* =========================
           GENERAL
        ========================= */

        section {
            padding: 100px 8%;
            scroll-margin-top: 80px;
        }

        .section-tag {
            color: var(--cyan);
            font-size: 12px;
            letter-spacing: 3px;
            font-weight: bold;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .section-title {
            font-size: clamp(30px, 4vw, 52px);
            margin-bottom: 18px;
            line-height: 1.1;
        }

        .section-text {
            color: var(--muted);
            line-height: 1.8;
            max-width: 750px;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 100vh;
            padding-top: 130px;
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            align-items: center;
            gap: 50px;
            position: relative;
            overflow: hidden;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border: 1px solid rgba(0,234,255,.3);
            border-radius: 50px;
            color: var(--cyan);
            background: rgba(0,234,255,.05);
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 25px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--green);
        }

        .hero h1 {
            font-size: clamp(45px, 7vw, 88px);
            line-height: .95;
            margin-bottom: 25px;
            letter-spacing: -3px;
        }

        .gradient-text {
            background: linear-gradient(90deg, var(--cyan), var(--blue), var(--purple), var(--pink));
            -webkit-background-clip: text;
            color: transparent;
        }

        .hero p {
            color: var(--muted);
            font-size: 18px;
            line-height: 1.7;
            max-width: 650px;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            margin-top: 35px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 22px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .5px;
            transition: .3s;
            display: inline-block;
            cursor: pointer;
        }

        .btn-primary {
            color: #001014;
            background: var(--cyan);
            box-shadow: 0 0 25px rgba(0,234,255,.25);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 35px rgba(0,234,255,.5);
        }

        .btn-outline {
            border: 1px solid rgba(255,255,255,.2);
            color: white;
        }

        .btn-outline:hover {
            border-color: var(--cyan);
            color: var(--cyan);
            transform: translateY(-3px);
        }

        /* =========================
           CYBER SHIELD
        ========================= */

        .shield-area {
            height: 550px;
            display: grid;
            place-items: center;
            position: relative;
        }

        .shield-ring {
            position: absolute;
            border: 1px solid rgba(0,234,255,.18);
            border-radius: 50%;
            animation: rotate 15s linear infinite;
        }

        .ring1 {
            width: 430px;
            height: 430px;
        }

        .ring2 {
            width: 350px;
            height: 350px;
            border-color: rgba(139,92,246,.25);
            animation-direction: reverse;
            animation-duration: 10s;
        }

        .shield-svg {
            width: 300px;
            filter: drop-shadow(0 0 20px rgba(0,234,255,.5));
            animation: float 4s ease-in-out infinite;
            z-index: 3;
        }

        .scan-line {
            position: absolute;
            width: 280px;
            height: 2px;
            background: var(--cyan);
            box-shadow: 0 0 15px var(--cyan);
            animation: scan 3s linear infinite;
            z-index: 5;
        }

        .secure-badge {
            position: absolute;
            bottom: 45px;
            padding: 10px 18px;
            border: 1px solid rgba(50,245,169,.4);
            color: var(--green);
            background: rgba(50,245,169,.05);
            border-radius: 50px;
            font-size: 12px;
            letter-spacing: 2px;
            box-shadow: 0 0 20px rgba(50,245,169,.12);
        }

        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        @keyframes scan {
            0% { transform: translateY(-130px); opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(130px); opacity: 0; }
        }

        /* =========================
           STATS
        ========================= */

        .stats {
            padding-top: 30px;
            padding-bottom: 80px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            border: 1px solid var(--border);
            background: rgba(255,255,255,.02);
        }

        .stat {
            padding: 30px;
            text-align: center;
            border-right: 1px solid var(--border);
        }

        .stat:last-child {
            border-right: none;
        }

        .stat h2 {
            color: var(--cyan);
            font-size: 38px;
            margin-bottom: 8px;
        }

        .stat p {
            color: var(--muted);
            font-size: 13px;
        }

        /* =========================
           ABOUT
        ========================= */

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
        }

        .image-card {
            height: 430px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border);
            position: relative;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: .7;
            transition: .5s;
        }

        .image-card:hover img {
            transform: scale(1.05);
            opacity: .9;
        }

        .image-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 40%, rgba(5,5,16,.95));
        }

        .image-caption {
            position: absolute;
            bottom: 25px;
            left: 25px;
        }

        .image-caption h3 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .image-caption p {
            color: var(--cyan);
            font-size: 12px;
        }

        .mini-grid {
            display: grid;

<section class="markdown-page" id="markdownPage">

    <div class="markdown-container">

        <div class="markdown-top">

            <div>
                <div class="markdown-label">
                    CYBER AWARENESS CLUB // DOCUMENT
                </div>

                <h1 class="markdown-title" id="markdownTitle">
                    DOCUMENT DETAILS
                </h1>
            </div>

            <button class="markdown-back" onclick="closeMarkdownPage()">
                ← BACK
            </button>

        </div>

        <div class="markdown-content"
             id="markdownContent">

            <div class="markdown-loading">
                LOADING DOCUMENT...
            </div>

        </div>

    </div>

</section>
        <button class="small-btn"
        onclick="openMarkdownPage('CYBER%20AWARENESS%20CLUB.md', 'CYBER WORKSHOPS')">
    VIEW DETAILS →
</button>
<script>

/* =========================
   MARKDOWN DOCUMENT VIEWER
========================= */

async function openMarkdownPage(fileName, pageTitle) {

    const page = document.getElementById("markdownPage");
    const content = document.getElementById("markdownContent");
    const title = document.getElementById("markdownTitle");

    title.textContent = pageTitle;

    page.classList.add("show");

    /* Hide normal website sections */
    document.querySelectorAll(
        "body > section:not(#markdownPage)"
    ).forEach(section => {
        section.dataset.previousDisplay = section.style.display;
        section.style.display = "none";
    });

    content.innerHTML = `
        <div class="markdown-loading">
            LOADING DOCUMENT...
        </div>
    `;

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

    try {

        const response = await fetch(fileName);

        if (!response.ok) {
            throw new Error("Markdown file not found");
        }

        const markdownText = await response.text();

        /* Convert Markdown to HTML */
        content.innerHTML = marked.parse(markdownText);

        /*
         * Fix relative image paths.
         * Example:
         * images/photo.png
         * ./images/photo.png
         */
        const basePath = fileName.substring(
            0,
            fileName.lastIndexOf("/") + 1
        );

        content.querySelectorAll("img").forEach(img => {

            const src = img.getAttribute("src");

            if (
                src &&
                !src.startsWith("http://") &&
                !src.startsWith("https://") &&
                !src.startsWith("data:")
            ) {
                img.src = basePath + src;
            }

        });

    } catch (error) {

        content.innerHTML = `
            <div class="markdown-loading">

                <h2 style="color:#ff3cac;">
                    DOCUMENT NOT FOUND
                </h2>

                <p>
                    The Markdown document could not be loaded.
                </p>

            </div>
        `;

        console.error(error);
    }
}


/* =========================
   CLOSE MARKDOWN PAGE
========================= */

function closeMarkdownPage() {

    const page = document.getElementById("markdownPage");

    page.classList.remove("show");

    document.querySelectorAll(
        "body > section:not(#markdownPage)"
    ).forEach(section => {

        section.style.display =
            section.dataset.previousDisplay || "";

    });

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

</script>
